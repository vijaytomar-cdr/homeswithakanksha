name: Refresh public market data

on:
  workflow_dispatch:
  schedule:
    # Redfin's monthly release date varies. A weekly check catches each release
    # promptly while the updater still selects only the newest completed month.
    # 18:17 UTC Monday = 11:17 a.m. Arizona time.
    - cron: "17 18 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-public-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and validate latest city data
        run: npm run market:update

      - name: Commit verified snapshot
        run: |
          if git diff --quiet -- data/generated/market-snapshot.json data/generated/market-history.json; then
            echo "The verified snapshot is already current."
            exit 0
          fi

          git config user.name "homes-with-akanksha-data"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated/market-snapshot.json data/generated/market-history.json
          git commit -m "data: refresh Greater Phoenix market snapshot"
          git push
